<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Styled Form</title>
  <style>
   .client-form-container {
    max-width: 600px;
    margin: 48px auto;
    padding: 32px 28px;
    background: linear-gradient(135deg, #f7faff 70%, #e3eefe 100%);
    border-radius: 18px;
    box-shadow: 0 8px 32px rgba(0,0,0,0.10);
    font-family: 'Segoe UI', Arial, sans-serif;
  }
  
  .client-form-container h2 {
    text-align: center;
    margin-bottom: 24px;
    color: #007bff;
    font-size: 2rem;
    font-weight: 700;
  }
  
  .form-group {
    margin-bottom: 18px;
  }
  
  .form-group label {
    display: block;
    margin-bottom: 7px;
    color: #333;
    font-weight: 500;
    font-size: 15px;
  }
  
  .form-control {
    width: 100%;
    padding: 11px;
    border: 1px solid #bfc8d6;
    border-radius: 8px;
    font-size: 15px;
    background: #fff;
    transition: border-color 0.3s;
  }
  
  .form-control:focus {
    border-color: #007bff;
    outline: none;
  }
  
  .addresses {
    margin-top: 28px;
    background: #f0f6ff;
    padding: 18px 14px;
    border-radius: 12px;
    box-shadow: 0 2px 8px rgba(0,123,255,0.05);
  }
  
  .addresses h3 {
    margin-bottom: 16px;
    color: #0056b3;
    font-size: 1.2rem;
    font-weight: 600;
  }
  
  .address-group {
    margin-bottom: 20px;
    padding-bottom: 12px;
    border-bottom: 1px solid #e0e7ef;
  }
  
  .btn {
    padding: 10px 18px;
    font-size: 15px;
    font-weight: 600;
    border-radius: 8px;
    border: none;
    margin-right: 8px;
    margin-top: 8px;
    cursor: pointer;
    transition: background 0.2s, color 0.2s, transform 0.2s;
  }
  
  .btn-primary {
    background: linear-gradient(135deg, #007bff, #0056b3);
    color: #fff;
  }
  
  .btn-primary:hover {
    background: linear-gradient(135deg, #0056b3, #003e7e);
    transform: scale(1.04);
  }
  
  .btn-secondary {
    background: #e3eefe;
    color: #007bff;
  }
  
  .btn-secondary:hover {
    background: #cfe2ff;
    color: #0056b3;
    transform: scale(1.04);
  }
  
  .btn-danger {
    background: #dc3545;
    color: #fff;
  }
  
  .btn-danger:hover {
    background: #b71c2a;
    transform: scale(1.04);
  }
  .client-grid {
  max-width: 900px;
  margin: 48px auto;
  padding: 32px 28px;
  background: linear-gradient(135deg, #f7faff 70%, #e3eefe 100%);
  border-radius: 18px;
  box-shadow: 0 8px 32px rgba(0,0,0,0.10);
  font-family: 'Segoe UI', Arial, sans-serif;
}
  </style>
</head>
<body>
 <div class="client-grid">
    <h2>Add Client</h2>
    <form (ngSubmit)="saveClient()">
      <div class="form-group">
        <label for="title">Title</label>
        <select id="title" class="form-control" [(ngModel)]="client.title" name="title" required>
          <option value="">Select Title</option>
          <option value="Mr">Mr</option>
          <option value="Mrs">Mrs</option>
          <option value="Ms">Ms</option>
        </select>
      </div>
  
      <div class="form-group">
        <label for="firstName">First Name</label>
        <input
          type="text"
          id="firstName"
          class="form-control"
          [(ngModel)]="client.firstName"
          name="firstName"
          required
        />
      </div>
  
      <div class="form-group">
        <label for="lastName">Last Name</label>
        <input
          type="text"
          id="lastName"
          class="form-control"
          [(ngModel)]="client.lastName"
          name="lastName"
          required
        />
      </div>
  
      <div class="form-group">
        <label for="gender">Gender</label>
        <select id="gender" class="form-control" [(ngModel)]="client.gender" name="gender" required>
          <option value="">Select Gender</option>
          <option value="Male">Male</option>
          <option value="Female">Female</option>
          <option value="Other">Other</option>
        </select>
      </div>
  
      <div class="form-group">
        <label for="dateOfBirth">Date of Birth</label>
        <input
          type="date"
          id="dateOfBirth"
          class="form-control"
          [(ngModel)]="client.dob"
          name="dateOfBirth"
          required
        />
      </div>
  
      <div class="addresses">
        <h3>Addresses</h3>
        <div *ngFor="let address of client.addresses; let i = index" class="address-group">
          <div class="form-group">
            <label for="addressLine1">Address Line 1</label>
            <input
              type="text"
              id="addressLine1"
              class="form-control"
              [(ngModel)]="address.addressLine1"
              name="addressLine1{{i}}"
              required
            />
          </div>
          <div class="form-group">
            <label for="town">Town</label>
            <input
              type="text"
              id="town"
              class="form-control"
              [(ngModel)]="address.town"
              name="town{{i}}"
              required
            />
          </div>
          <div class="form-group">
            <label for="city">City</label>
            <input
              type="text"
              id="city"
              class="form-control"
              [(ngModel)]="address.city"
              name="city{{i}}"
              required
            />
          </div>
          <div class="form-group">
            <label for="pinCode">Pin Code</label>
            <input
              type="text"
              id="pinCode"
              class="form-control"
              [(ngModel)]="address.pinCode"
              name="pinCode{{i}}"
              required
            />
          </div>
          <button type="button" class="btn btn-danger" (click)="removeAddress(i)">Remove Address</button>
        </div>
        <button type="button" class="btn btn-secondary" (click)="addAddress()">Add Address</button>
      </div>
  
      <button type="submit" class="btn btn-primary">Save Client</button>
      <button type="button" class="btn btn-secondary" (click)="Cancel()">Cancel</button>
    </form>
    </div>
</body>
</html>
